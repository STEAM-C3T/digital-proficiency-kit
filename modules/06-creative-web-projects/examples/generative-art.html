<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generative Grid</title>
    <style>
      body {
        margin: 0;
        background: #111827;
        color: #e5e7eb;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      .controls {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        padding: 0.75rem;
        background: #111827;
        border: 1px solid #9ca3af;
        border-radius: 0.5rem;
      }
      button {
        padding: 0.5rem 0.75rem;
        font: inherit;
      }
      :focus-visible {
        outline: 3px solid #fbbf24;
        outline-offset: 3px;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="controls">
      <button id="motion-toggle" type="button" aria-pressed="false">Pause animation</button>
      <p id="motion-status" aria-live="polite"></p>
    </div>
    <canvas id="c"></canvas>
    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const motionToggle = document.getElementById("motion-toggle");
      const motionStatus = document.getElementById("motion-status");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let isPaused = reducedMotion.matches;
      let animationFrame = null;

      function updateMotionControl(message = "") {
        motionToggle.textContent = isPaused ? "Play animation" : "Pause animation";
        motionToggle.setAttribute("aria-pressed", String(isPaused));
        motionStatus.textContent = message;
      }

      motionToggle.addEventListener("click", () => {
        isPaused = !isPaused;
        if (isPaused && animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        } else if (!isPaused && animationFrame === null) {
          animationFrame = requestAnimationFrame(loop);
        }
        updateMotionControl(isPaused ? "Animation paused." : "Animation playing.");
      });

      reducedMotion.addEventListener("change", (event) => {
        if (event.matches) {
          isPaused = true;
          if (animationFrame !== null) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
          updateMotionControl("Animation paused to respect your reduced-motion preference.");
        }
      });

      updateMotionControl(
        isPaused ? "Animation starts paused because reduced motion is enabled." : ""
      );

      function resize() {
        canvas.width = innerWidth;
        canvas.height = innerHeight;
      }
      addEventListener("resize", resize);
      resize();

      function loop(t) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cols = 20,
          rows = 12,
          pad = 20;
        const cellW = (canvas.width - pad * 2) / cols;
        const cellH = (canvas.height - pad * 2) / rows;
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < cols; x++) {
            const cx = pad + x * cellW + cellW / 2;
            const cy = pad + y * cellH + cellH / 2;
            const r =
              ((Math.sin(x + y + t * 0.002) * 0.5 + 0.5) *
                Math.min(cellW, cellH)) /
              3;
            ctx.fillStyle = `hsl(${
              (x * 18 + y * 12 + t * 0.05) % 360
            } 80% 60% / 0.7)`;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        animationFrame = requestAnimationFrame(loop);
      }
      if (!isPaused) {
        animationFrame = requestAnimationFrame(loop);
      }
    </script>
  </body>
</html>
